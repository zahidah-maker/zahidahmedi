<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta Tags -->
    <meta
      name="keywords"
      content="MediTrack HIMS, Doctor Management, Doctors Information, Hospital Staff"
    />

    <meta
      name="description"
      content="MediTrack HIMS doctors page for viewing doctor information, specializations, and related details."
    />

    <meta name="author" content="Syarifah Zahidah" />

    <title>Doctors | MediTrack HIMS</title>

    <script>
      if (sessionStorage.getItem("himsLoggedIn") !== "true") {
        location.replace("index.html");
      }
    </script>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/app.css" />

    <script src="../js/theme.js"></script>
  </head>

  <body>
    <!-- Sidebar Overlay -->
    <div id="overlay" class="overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar"></aside>

    <!-- Main Area -->
    <div class="main-area">
      <!-- Topbar -->
      <header id="topbar" class="topbar"></header>

      <!-- Main Content -->
      <main class="content">
        <!-- Page Heading -->
        <div class="page-head">
          <div>
            <h2>Doctors</h2>
            <p>
              Workload by doctor. Every number links to the matching
              appointments.
            </p>
          </div>
        </div>

        <!-- Appointments Chart -->
        <div class="panel mb-3">
          <h3 class="panel-title">Appointments per doctor</h3>

          <p class="chart-hint">
            Click a bar to open that doctor's appointments.
          </p>

          <div class="chart-box tall">
            <canvas
              id="doctorChart"
              role="img"
              aria-label="Stacked bar chart of appointments per doctor by status"
            >
            </canvas>
          </div>
        </div>

        <!-- Search and Filter -->
        <div class="row g-2 toolbar">
          <div class="col-md-6">
            <input
              type="search"
              id="search"
              class="form-control"
              placeholder="Search doctors by name"
              aria-label="Search doctors"
            />
          </div>

          <div class="col-md-4">
            <select
              id="filter-dept"
              class="form-select"
              aria-label="Filter by department"
            >
              <option value="">All departments</option>
            </select>
          </div>
        </div>

        <!-- Active Filters -->
        <div id="chips" class="chips"></div>

        <!-- Doctor Cards -->
        <div class="row g-3" id="doctor-grid"></div>

        <!-- Empty State -->
        <div id="empty-state" class="empty d-none">
          No doctors match these filters.
        </div>
      </main>

      <!-- Footer -->
      <footer id="footer" class="app-footer"></footer>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Project JavaScript -->
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/doctors.js"></script>
  </body>
</html>
